[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Python path - add project root to path
pythonpath = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    e2e: End-to-end tests that test the full application flow
    slow: Tests that take a long time to run
    asynchronous: Tests that use async/await

# Asyncio configuration
asyncio_mode = auto

# Coverage options (when pytest-cov is installed)
[coverage:run]
source = lib_specifications
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */__init__.py
    */logging_config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
# Fail if coverage is below this threshold (optional, uncomment to enable)
# fail_under = 95
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

